<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翁法罗斯 · 永恒之地</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="sigil" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="6"/><path d="M16 3v26M3 16h26"/></svg>
      </div>
      <div>
        <h1>翁法罗斯</h1>
        <p class="sub">Amphoreus · The Eternal Land</p>
      </div>
    </div>
    <div class="head-right">
      <a class="booklink" href="/book">如我所书 →</a>
      <div class="clock">
        <p class="date" id="date">——</p>
        <p class="time" id="time">——</p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="world">世界</button>
    <button role="tab" aria-selected="false" data-view="scions">黄金裔</button>
    <button role="tab" aria-selected="false" data-view="codex">如我所书</button>
  </nav>

  <main>
    <!-- 世界 -->
    <section class="view active" id="view-world">
      <div class="grid-main">
        <div class="panel map-panel">
          <div class="panel-head">
            <h2>星图</h2>
            <span class="hint" id="map-hint">点一处地方，看它此刻的样子</span>
          </div>
          <div class="map-wrap">
            <svg id="map" viewBox="1 6 98 95" preserveAspectRatio="xMidYMid meet" role="img" aria-label="翁法罗斯全境示意图"></svg>
          </div>
          <div class="legend">
            <span><i class="sw" style="background:var(--gold)"></i>完好</span>
            <span><i class="sw" style="background:var(--amber)"></i>侵蚀</span>
            <span><i class="sw" style="background:var(--ash)"></i>失守</span>
            <span><i class="sw ring"></i>火种已归位</span>
          </div>
        </div>

        <div class="panel detail-panel" id="city-detail">
          <div class="panel-head"><h2>此刻</h2></div>
          <p class="empty">选择星图上的一处地方。</p>
        </div>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>编年</h2>
          <span class="hint">规则引擎逐拍产出，叙事层择优成文</span>
        </div>
        <ol class="stream" id="stream"></ol>
      </div>
    </section>

    <!-- 黄金裔 -->
    <section class="view" id="view-scions">
      <div class="panel">
        <div class="panel-head">
          <h2>十二因子 · 黄金裔</h2>
          <span class="hint">每人逐猎一枚火种，各走一条模拟命途</span>
        </div>
        <div class="scion-grid" id="scion-grid"></div>
      </div>
    </section>

    <!-- 如我所书 -->
    <section class="view" id="view-codex">
      <div class="panel">
        <div class="panel-head">
          <h2>如我所书</h2>
          <span class="hint">十三卷，每卷五节</span>
        </div>
        <div class="codex" id="codex"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span id="foot-meta">——</span>
    <span class="dot">·</span>
    <span>种子 <b id="foot-seed">—</b></span>
    <span class="dot">·</span>
    <span id="foot-pace"></span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
